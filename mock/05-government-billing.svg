  <text x="72" y="145" class="label" fill="#9fb0bc">WORKSPACE</text><text x="86" y="184" class="sm" fill="#d6e0e5">Overview</text><text x="86" y="218" class="sm" fill="#d6e0e5">Private orders</text><text x="72" y="270" class="label" fill="#9fb0bc">TGSPDCL ORDERS</text><text x="99" y="307" class="sm" fill="#d6e0e5">TNotes &amp; assessment</text><text x="99" y="339" class="sm" fill="#d6e0e5">Transformers</text><text x="99" y="371" class="sm" fill="#d6e0e5">Delivery challans</text><rect x="67" y="385" width="192" height="39" rx="10" fill="#fff" opacity=".12"/><circle cx="84" cy="404" r="4" fill="#cb8054"/><text x="99" y="408" class="sm bold white">Government bills</text><text x="72" y="463" class="label" fill="#9fb0bc">PEOPLE</text><text x="99" y="496" class="sm" fill="#d6e0e5">Employees &amp; salary</text><circle cx="91" cy="922" r="14" fill="#bf764b"/><text x="91" y="926" text-anchor="middle" class="tiny bold white">DS</text><text x="113" y="919" class="tiny bold white">Workshop admin</text><text x="113" y="934" class="tiny" fill="#adbdc7">Secure workspace</text>
  <rect x="282" y="38" width="1118" height="58" fill="#fff"/><line x1="282" y1="96" x2="1400" y2="96" stroke="#e9edea"/><rect x="308" y="52" width="330" height="31" rx="9" fill="#f5f7f5"/><circle cx="325" cy="67" r="5" fill="none" stroke="#81909a" stroke-width="1.4"/><path d="m329 71 5 5" stroke="#81909a" stroke-width="1.4"/><text x="343" y="71" class="tiny muted">Search SAP no., agreement, center…</text>
  <text x="308" y="137" font-size="24" class="bold ink">TGSPDCL · Government bills</text><text x="308" y="158" class="sm muted">Bill only transformers that have been delivered against a delivery challan.</text><rect x="1180" y="117" width="192" height="38" rx="11" fill="#142b40"/><text x="1276" y="141" text-anchor="middle" class="sm bold white">+ Create government bill</text>
  <rect x="308" y="178" width="1064" height="69" rx="13" fill="#f8f6f1"/>
  <text x="330" y="204" class="tiny bold muted">BILL LIFECYCLE</text><line x1="567" y1="212" x2="1014" y2="212" stroke="#dce2df" stroke-width="3"/><line x1="567" y1="212" x2="792" y2="212" stroke="#b8754f" stroke-width="3"/>
  <circle cx="567" cy="212" r="8" fill="#b8754f"/><circle cx="792" cy="212" r="8" fill="#fff" stroke="#b8754f" stroke-width="3"/><circle cx="1014" cy="212" r="8" fill="#fff" stroke="#aebbbd" stroke-width="2"/>
  <text x="567" y="235" text-anchor="middle" class="tiny bold ink">Pending</text><text x="792" y="235" text-anchor="middle" class="tiny bold ink">Received · amount + date</text><text x="1014" y="235" text-anchor="middle" class="tiny bold ink">GST Filed · month + invoice</text>
  <rect x="308" y="265" width="1064" height="291" rx="16" fill="#fff" stroke="#e4e9e5"/><text x="330" y="295" font-size="15" class="bold ink">Government bill register</text><text x="330" y="315" class="tiny muted">Search and filter by SAP number, date, SPM Center, and status.</text>
  <rect x="330" y="331" width="1020" height="31" rx="7" fill="#f4f6f3"/><text x="344" y="351" class="tiny bold muted">SAP / DATE</text><text x="527" y="351" class="tiny bold muted">SPM CENTER</text><text x="690" y="351" class="tiny bold muted">AGREEMENT</text><text x="835" y="351" class="tiny bold muted">UNITS</text><text x="930" y="351" class="tiny bold muted">AMOUNT + GST</text><text x="1120" y="351" class="tiny bold muted">STATUS</text><text x="1327" y="351" text-anchor="end" class="tiny bold muted">ACTIONS</text>
  <rect x="330" y="369" width="1020" height="49" rx="8" fill="#fcf7f2"/><text x="344" y="389" class="sm bold ink">SAP-2618</text><text x="344" y="406" class="tiny muted">15 Oct 2026</text><text x="527" y="397" class="tiny ink">Warangal</text><text x="690" y="397" class="tiny ink">AGR-2026-18</text><text x="835" y="397" class="tiny ink">4 delivered</text><text x="930" y="397" class="tiny ink">₹1,82,000 + ₹32,760</text><rect x="1120" y="383" width="75" height="22" rx="11" fill="#fbefdc"/><text x="1157" y="398" text-anchor="middle" class="tiny bold" fill="#98631f">PENDING</text><text x="1327" y="398" text-anchor="end" class="tiny bold" fill="#a45e39">View · Edit · Export</text>
  <rect x="330" y="425" width="1020" height="49" rx="8" fill="#fff"/><text x="344" y="445" class="sm bold ink">SAP-2612</text><text x="344" y="462" class="tiny muted">10 Oct 2026</text><text x="527" y="453" class="tiny ink">Karimnagar</text><text x="690" y="453" class="tiny ink">AGR-2026-12</text><text x="835" y="453" class="tiny ink">3 delivered</text><text x="930" y="453" class="tiny ink">₹98,000 + ₹17,640</text><rect x="1120" y="439" width="78" height="22" rx="11" fill="#e9eff2"/><text x="1159" y="454" text-anchor="middle" class="tiny bold" fill="#31566e">RECEIVED</text><text x="1327" y="454" text-anchor="end" class="tiny bold" fill="#a45e39">View · Edit · Export</text>
  <rect x="330" y="481" width="1020" height="49" rx="8" fill="#fff"/><text x="344" y="501" class="sm bold ink">SAP-2604</text><text x="344" y="518" class="tiny muted">04 Oct 2026</text><text x="527" y="509" class="tiny ink">Khammam</text><text x="690" y="509" class="tiny ink">AGR-2026-04</text><text x="835" y="509" class="tiny ink">6 delivered</text><text x="930" y="509" class="tiny ink">₹2,45,000 + ₹44,100</text><rect x="1120" y="495" width="86" height="22" rx="11" fill="#e7f1eb"/><text x="1163" y="510" text-anchor="middle" class="tiny bold" fill="#47785e">GST FILED</text><text x="1327" y="510" text-anchor="end" class="tiny bold" fill="#a45e39">View · Edit · Export</text>
  <text x="330" y="545" class="tiny muted">Open a bill to update status, view attachments, edit or delete, and export transformer details to Excel.</text>
  <rect x="308" y="574" width="1064" height="324" rx="16" fill="#f8f6f1" stroke="#e7e4dc"/><text x="330" y="605" font-size="15" class="bold ink">Create bill · eligible units only</text><text x="330" y="624" class="tiny muted">The system lists Delivered transformers for the selected SPM Center; count is calculated from selected units.</text>
  <rect x="330" y="642" width="224" height="41" rx="8" fill="#fff" stroke="#e0e5df"/><text x="344" y="659" class="tiny bold muted">SAP NO.</text><text x="344" y="675" class="tiny ink">SAP-2619</text><rect x="564" y="642" width="224" height="41" rx="8" fill="#fff" stroke="#e0e5df"/><text x="578" y="659" class="tiny bold muted">AGREEMENT NO.</text><text x="578" y="675" class="tiny ink">AGR-2026-19</text><rect x="798" y="642" width="206" height="41" rx="8" fill="#fff" stroke="#e0e5df"/><text x="812" y="659" class="tiny bold muted">BILL DATE</text><text x="812" y="675" class="tiny ink">15 Oct 2026</text><rect x="1014" y="642" width="336" height="41" rx="8" fill="#fff" stroke="#e0e5df"/><text x="1028" y="659" class="tiny bold muted">SPM CENTER</text><text x="1028" y="675" class="tiny ink">Warangal  ▾</text>
  <text x="330" y="709" class="tiny bold muted">DELIVERED TRANSFORMERS · ONLY UNBILLED UNITS AT THIS CENTER</text><text x="1327" y="709" text-anchor="end" class="tiny bold" fill="#47785e">2 SELECTED · COUNT AUTO</text>
  <rect x="330" y="719" width="1020" height="31" rx="7" fill="#fff"/><rect x="344" y="728" width="13" height="13" rx="3" fill="#b8754f"/><path d="m347 734 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/><text x="367" y="740" class="tiny ink">DTR-4088 · SN-88196 · 500 kVA · Delivered on DC-501</text>
  <rect x="330" y="756" width="1020" height="31" rx="7" fill="#fff"/><rect x="344" y="765" width="13" height="13" rx="3" fill="#b8754f"/><path d="m347 771 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/><text x="367" y="777" class="tiny ink">DTR-4038 · SN-88081 · 250 kVA · Delivered on DC-498</text>
  <rect x="330" y="800" width="245" height="39" rx="8" fill="#fff" stroke="#e0e5df"/><text x="344" y="817" class="tiny bold muted">BILL AMOUNT</text><text x="344" y="832" class="tiny ink">₹ 75,000</text><rect x="585" y="800" width="245" height="39" rx="8" fill="#fff" stroke="#e0e5df"/><text x="599" y="817" class="tiny bold muted">GST AMOUNT</text><text x="599" y="832" class="tiny ink">₹ 13,500</text><rect x="840" y="800" width="320" height="39" rx="8" fill="#fff" stroke="#e0e5df"/><text x="854" y="817" class="tiny bold muted">BILL ATTACHMENTS</text><text x="854" y="832" class="tiny ink">Add PDF / photos · up to 5 × 2 MB</text><rect x="1170" y="800" width="180" height="39" rx="9" fill="#142b40"/><text x="1260" y="824" text-anchor="middle" class="tiny bold white">Create government bill</text>
  <rect x="330" y="850" width="1020" height="30" rx="7" fill="#eaf2ec"/><text x="346" y="870" class="tiny bold" fill="#47785e">Bill status updates in order: PENDING → RECEIVED (amount credited + date) → GST FILED (filing month + invoice no.).</text>
  <text x="308" y="923" class="tiny muted">A bill cannot be created from Received, In Repair, Repaired, or Scrap units; only Delivered transformer records are eligible.</text>
</svg>
