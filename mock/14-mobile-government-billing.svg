<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile TGSPDCL government bills</title>
  <desc id="desc">Mobile government bill register with Pending, Received, and GST Filed stages, bill creation from delivered transformers, SAP and agreement identifiers, attachments, Excel export, credited amount/date, GST filing month and invoice number.</desc>
  <defs><linearGradient id="top" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:9px}.sm{font-size:12px}.label{font-size:9px;font-weight:700;letter-spacing:.65px}.bold{font-weight:700}</style></defs>
  <rect width="430" height="932" fill="#f3f5f2"/><rect width="430" height="107" fill="url(#top)"/><text x="20" y="22" class="tiny bold white">9:41</text><text x="20" y="59" font-size="18" class="bold white">TGSPDCL · Bills</text><text x="20" y="81" class="tiny" fill="#ced9df">Only transformers delivered against a DC</text>
  <rect x="18" y="119" width="394" height="55" rx="12" fill="#fff" stroke="#e2e7e2"/><circle cx="38" cy="146" r="6" fill="none" stroke="#71808b" stroke-width="1.4"/><path d="m42 150 4 4" stroke="#71808b" stroke-width="1.4"/><text x="58" y="150" class="sm muted">Search SAP no., agreement or center</text>
  <rect x="18" y="185" width="394" height="58" rx="12" fill="#f8f6f1"/><text x="32" y="207" class="tiny bold muted">BILL STATUS</text><text x="32" y="230" class="tiny bold" fill="#98631f">Pending  4</text><text x="158" y="230" class="tiny bold" fill="#31566e">Received  2</text><text x="300" y="230" class="tiny bold" fill="#47785e">GST Filed  8</text>
  <rect x="18" y="255" width="394" height="48" rx="11" fill="#142b40"/><text x="215" y="285" text-anchor="middle" class="sm bold white">+ Create bill from delivered units</text>
  <text x="20" y="333" class="label muted">GOVERNMENT BILL REGISTER</text>
  <rect x="18" y="346" width="394" height="118" rx="13" fill="#fff" stroke="#eadbce"/><text x="34" y="372" class="sm bold ink">SAP-2618 · Warangal</text><rect x="307" y="358" width="86" height="21" rx="10" fill="#fbefdc"/><text x="350" y="373" text-anchor="middle" class="tiny bold" fill="#98631f">PENDING</text><text x="34" y="392" class="tiny muted">AGR-2026-18 · 4 delivered transformers</text><text x="34" y="413" class="sm bold ink">₹1,82,000  <tspan class="tiny muted">+ GST ₹32,760</tspan></text><text x="34" y="435" class="tiny muted">Attachments · DC links · 15 Oct 2026</text><text x="393" y="452" text-anchor="end" class="tiny bold" fill="#a45e39">View · Edit · Export · Delete</text>
  <rect x="18" y="475" width="394" height="109" rx="13" fill="#fff" stroke="#e2e7e2"/><text x="34" y="501" class="sm bold ink">SAP-2612 · Karimnagar</text><rect x="307" y="487" width="86" height="21" rx="10" fill="#e9eff2"/><text x="350" y="502" text-anchor="middle" class="tiny bold" fill="#31566e">RECEIVED</text><text x="34" y="522" class="tiny muted">AGR-2026-12 · 3 delivered transformers</text><text x="34" y="544" class="sm bold ink">₹98,000  <tspan class="tiny muted">+ GST ₹17,640</tspan></text><text x="34" y="565" class="tiny muted">Credited 12 Oct · GST filing pending</text>
  <rect x="18" y="595" width="394" height="109" rx="13" fill="#fff" stroke="#e2e7e2"/><text x="34" y="621" class="sm bold ink">SAP-2604 · Khammam</text><rect x="307" y="607" width="86" height="21" rx="10" fill="#e7f1eb"/><text x="350" y="622" text-anchor="middle" class="tiny bold" fill="#47785e">GST FILED</text><text x="34" y="642" class="tiny muted">AGR-2026-04 · 6 delivered transformers</text><text x="34" y="664" class="sm bold ink">₹2,45,000  <tspan class="tiny muted">+ GST ₹44,100</tspan></text><text x="34" y="685" class="tiny muted">Filing month Oct 2026 · Invoice INV-8820</text>
  <rect x="18" y="716" width="394" height="149" rx="13" fill="#f8f6f1" stroke="#e7e4dc"/><text x="34" y="741" class="sm bold ink">Bill lifecycle</text><text x="34" y="762" class="tiny muted">PENDING</text><text x="120" y="762" class="tiny muted">→</text><text x="148" y="762" class="tiny muted">RECEIVED</text><text x="235" y="762" class="tiny muted">→</text><text x="263" y="762" class="tiny muted">GST FILED</text>
  <text x="34" y="787" class="tiny ink">1. Record amount credited (&gt; ₹0) and credited date.</text><text x="34" y="807" class="tiny ink">2. Record GST filing month and invoice number.</text>
  <text x="34" y="831" class="tiny muted">Attachments / status / export details remain on bill view.</text><text x="34" y="849" class="tiny bold" fill="#a45e39">DELIVERED FIRST · THEN BILLABLE</text>
  <rect x="0" y="877" width="430" height="55" fill="#fff"/><line x1="0" y1="877" x2="430" y2="877" stroke="#e3e8e3"/><rect x="125" y="886" width="86" height="38" rx="10" fill="#eaf0eb"/><text x="168" y="910" text-anchor="middle" class="tiny bold" fill="#315e48">TGSPDCL</text><text x="62" y="910" text-anchor="middle" class="tiny muted">Home</text><text x="270" y="910" text-anchor="middle" class="tiny muted">People</text><text x="375" y="910" text-anchor="middle" class="tiny muted">More</text>
</svg>
