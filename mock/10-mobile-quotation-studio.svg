  <rect width="430" height="932" fill="#f3f5f2"/><rect width="430" height="112" fill="url(#top)"/>
  <text x="20" y="23" class="tiny bold white">9:41</text><text x="20" y="62" font-size="19" class="bold white">Quotation studio</text><text x="20" y="84" class="tiny" fill="#ced9df">Private customer · ad-hoc documents</text>
  <text x="20" y="138" class="label muted">DOCUMENT TYPE</text>
