<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile quotation and service bill editor</title>
  <desc id="desc">Single-column mobile document studio for private quotations, ad-hoc quotes and service bills, with customer data, line items, GST, output format, totals, preview, generation, PDF regeneration and WhatsApp sharing.</desc>
