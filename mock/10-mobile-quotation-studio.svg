  <rect x="18" y="363" width="191" height="46" rx="10" fill="#fff" stroke="#e2e7e2"/><text x="32" y="381" class="tiny bold muted">CONTACT / MOBILE</text><text x="32" y="399" class="tiny ink">S. Ramesh · 98480 12345</text>
