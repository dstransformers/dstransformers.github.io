<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS TGSPDCL delivery challan UI mockup</title>
  <desc id="desc">Delivery challan queue and creation workflow selecting repaired transformers from a single SPM Center, capturing TGSPDCL customer and drum details, generating a PDF, then uploading signed delivery proof.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f5f2"/><stop offset="1" stop-color="#e8eeeb"/></linearGradient><linearGradient id="nav" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#132b3d" flood-opacity=".1"/></filter><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:10px}.sm{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.bold{font-weight:700}.med{font-weight:600}</style></defs>
  <rect width="1440" height="1000" fill="url(#bg)"/><rect x="40" y="38" width="1360" height="924" rx="24" fill="#fff" filter="url(#sh)"/><path d="M64 38h218v924H64q-24 0-24-24V62q0-24 24-24" fill="url(#nav)"/><rect x="258" y="38" width="24" height="924" fill="url(#nav)"/>
  <rect x="68" y="66" width="42" height="42" rx="13" fill="#fff" opacity=".12"/><path d="M79 94V80h4l5 7 5-7h4v14h-4v-8l-5 6-5-6v8z" fill="#fff"/><circle cx="101" cy="76" r="4" fill="#cb8054"/><text x="120" y="83" class="sm bold white">D.S. TRANSFORMERS</text><text x="120" y="100" class="tiny" fill="#adbdc7">WORKSHOP OPERATIONS</text>
  <text x="72" y="145" class="label" fill="#9fb0bc">WORKSPACE</text><text x="86" y="184" class="sm" fill="#d6e0e5">Overview</text><text x="86" y="218" class="sm" fill="#d6e0e5">Private orders</text><text x="72" y="270" class="label" fill="#9fb0bc">TGSPDCL ORDERS</text><text x="99" y="307" class="sm" fill="#d6e0e5">TNotes &amp; assessment</text><text x="99" y="339" class="sm" fill="#d6e0e5">Transformers</text><rect x="67" y="353" width="192" height="39" rx="10" fill="#fff" opacity=".12"/><circle cx="84" cy="372" r="4" fill="#cb8054"/><text x="99" y="376" class="sm bold white">Delivery challans</text><text x="99" y="408" class="sm" fill="#d6e0e5">Government bills</text><text x="72" y="463" class="label" fill="#9fb0bc">PEOPLE</text><text x="99" y="496" class="sm" fill="#d6e0e5">Employees &amp; salary</text><circle cx="91" cy="922" r="14" fill="#bf764b"/><text x="91" y="926" text-anchor="middle" class="tiny bold white">DS</text><text x="113" y="919" class="tiny bold white">Workshop admin</text><text x="113" y="934" class="tiny" fill="#adbdc7">Secure workspace</text>
  <rect x="282" y="38" width="1118" height="58" fill="#fff"/><line x1="282" y1="96" x2="1400" y2="96" stroke="#e9edea"/><rect x="308" y="52" width="320" height="31" rx="9" fill="#f5f7f5"/><circle cx="325" cy="67" r="5" fill="none" stroke="#81909a" stroke-width="1.4"/><path d="m329 71 5 5" stroke="#81909a" stroke-width="1.4"/><text x="343" y="71" class="tiny muted">Search DC no., TNote or transformer…</text>
  <text x="308" y="137" font-size="24" class="bold ink">TGSPDCL · Delivery challans</text><text x="308" y="158" class="sm muted">Select repaired transformers by SPM Center, create the challan, then record delivery proof.</text>
  <rect x="1168" y="117" width="204" height="38" rx="11" fill="#142b40"/><text x="1270" y="141" text-anchor="middle" class="sm bold white">+ Generate delivery DC</text>
  <rect x="308" y="178" width="1064" height="77" rx="13" fill="#f8f6f1"/>
  <text x="330" y="204" class="tiny bold muted">DELIVERY QUEUE</text><text x="330" y="231" font-size="23" class="bold ink">4 <tspan font-size="12" class="muted">challans awaiting signed proof</tspan></text><rect x="723" y="197" width="155" height="33" rx="9" fill="#fff"/><text x="800" y="218" text-anchor="middle" class="tiny bold" fill="#47785e">12 REPAIRED UNITS READY</text><text x="903" y="218" class="tiny muted">Only Repaired transformers are selectable for a DC.</text>
  <rect x="308" y="273" width="1064" height="299" rx="16" fill="#fff" stroke="#e4e9e5"/>
  <text x="330" y="303" font-size="15" class="bold ink">Create TGSPDCL challan</text><text x="330" y="322" class="tiny muted">Center and TNote filters prevent mixed-center challans; select one or multiple repaired units.</text>
  <rect x="330" y="338" width="230" height="40" rx="8" fill="#f7f8f5" stroke="#e0e5df"/><text x="344" y="355" class="tiny bold muted">SPM CENTER</text><text x="344" y="371" class="tiny ink">Warangal  ▾</text>
  <rect x="570" y="338" width="230" height="40" rx="8" fill="#f7f8f5" stroke="#e0e5df"/><text x="584" y="355" class="tiny bold muted">SOURCE TNOTE</text><text x="584" y="371" class="tiny ink">TN-146 · optional  ▾</text>
  <rect x="810" y="338" width="246" height="40" rx="8" fill="#f7f8f5" stroke="#e0e5df"/><text x="824" y="355" class="tiny bold muted">DC DATE</text><text x="824" y="371" class="tiny ink">15 Oct 2026</text>
  <rect x="1066" y="338" width="284" height="40" rx="8" fill="#eaf2ec"/><text x="1080" y="355" class="tiny bold" fill="#47785e">TGSPDCL CUSTOMER</text><text x="1080" y="371" class="tiny ink">AE/SPM/Warangal/TGSPDCL</text>
  <text x="330" y="402" class="tiny bold muted">REPAIRED UNITS · WARANGAL</text><text x="1327" y="402" text-anchor="end" class="tiny bold" fill="#47785e">3 AVAILABLE</text>
  <rect x="330" y="412" width="1020" height="28" rx="7" fill="#f4f6f3"/><text x="362" y="431" class="tiny bold muted">DTR / SERIAL</text><text x="567" y="431" class="tiny bold muted">TNOTE / DATE</text><text x="783" y="431" class="tiny bold muted">CAPACITY</text><text x="954" y="431" class="tiny bold muted">CENTER</text><text x="1259" y="431" text-anchor="end" class="tiny bold muted">STATUS</text>
  <rect x="330" y="445" width="1020" height="35" rx="7" fill="#fcf7f2"/><rect x="344" y="456" width="13" height="13" rx="3" fill="#b8754f"/><path d="m347 462 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/><text x="367" y="468" class="tiny bold ink">DTR-4088 · SN-88196</text><text x="567" y="468" class="tiny ink">TN-146 · 15 Oct</text><text x="783" y="468" class="tiny ink">500 kVA</text><text x="954" y="468" class="tiny ink">Warangal</text><rect x="1190" y="452" width="70" height="20" rx="10" fill="#e7f1eb"/><text x="1225" y="466" text-anchor="middle" class="tiny bold" fill="#47785e">REPAIRED</text>
  <rect x="330" y="484" width="1020" height="35" rx="7" fill="#fff"/><rect x="344" y="495" width="13" height="13" rx="3" fill="#b8754f"/><path d="m347 501 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/><text x="367" y="507" class="tiny bold ink">DTR-4038 · SN-88081</text><text x="567" y="507" class="tiny ink">TN-145 · 14 Oct</text><text x="783" y="507" class="tiny ink">250 kVA</text><text x="954" y="507" class="tiny ink">Warangal</text><rect x="1190" y="491" width="70" height="20" rx="10" fill="#e7f1eb"/><text x="1225" y="505" text-anchor="middle" class="tiny bold" fill="#47785e">REPAIRED</text>
  <text x="330" y="546" class="tiny muted">Selected: 2 units · TNote references and dates are added automatically.</text><text x="1327" y="546" text-anchor="end" class="tiny bold ink">2 selected</text>
  <rect x="308" y="590" width="1064" height="224" rx="16" fill="#f8f6f1" stroke="#e7e4dc"/>
  <text x="330" y="620" font-size="15" class="bold ink">Challan details &amp; PDF</text>
  <rect x="330" y="637" width="245" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="344" y="654" class="tiny bold muted">CUSTOMER GSTIN</text><text x="344" y="670" class="tiny ink">TGSPDCL GSTIN · configured</text>
  <rect x="585" y="637" width="245" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="599" y="654" class="tiny bold muted">CUSTOMER ADDRESS</text><text x="599" y="670" class="tiny ink">TGSPDCL · fixed for destination</text>
  <rect x="840" y="637" width="230" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="854" y="654" class="tiny bold muted">RETURNING EMPTY DRUMS?</text><text x="854" y="670" class="tiny ink">Yes  ▾</text>
  <rect x="1080" y="637" width="270" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="1094" y="654" class="tiny bold muted">EMPTY DRUM COUNT</text><text x="1094" y="670" class="tiny ink">2</text>
  <rect x="330" y="691" width="672" height="53" rx="9" fill="#fff"/><text x="348" y="712" class="tiny bold ink">VALIDATION BUILT INTO THE FLOW</text><text x="348" y="731" class="tiny muted">One matching SPM Center · transformer details saved · unique units · customer data confirmed</text>
  <rect x="1020" y="691" width="156" height="39" rx="9" fill="#142b40"/><text x="1098" y="716" text-anchor="middle" class="tiny bold white">Create DC + PDF</text><rect x="1187" y="691" width="163" height="39" rx="9" fill="#fff" stroke="#dedfd9"/><text x="1268" y="716" text-anchor="middle" class="tiny bold ink">Save challan</text>
  <rect x="308" y="831" width="1064" height="93" rx="16" fill="#fff" stroke="#e4e9e5"/>
  <text x="330" y="860" font-size="15" class="bold ink">Delivery confirmation · DS/26-27/501</text><rect x="1183" y="844" width="167" height="24" rx="12" fill="#fff0d8"/><text x="1266" y="861" text-anchor="middle" class="tiny bold" fill="#98631f">AWAITING SIGNED PROOF</text>
  <text x="330" y="883" class="tiny muted">When the transformer returns, upload a signed delivery challan before marking it Delivered.</text>
  <rect x="330" y="891" width="154" height="25" rx="7" fill="#f5f7f5" stroke="#e0e5df"/><text x="407" y="908" text-anchor="middle" class="tiny bold ink">Upload signed DC</text><text x="503" y="908" class="tiny muted">PDF / photo attachment required</text>
  <rect x="1179" y="886" width="171" height="29" rx="8" fill="#47785e"/><text x="1264" y="905" text-anchor="middle" class="tiny bold white">Mark delivered</text>
  <text x="308" y="946" class="tiny muted">Existing challans retain view / edit / delete, PDF open / regenerate, transformer assignment, delivery attachment, and delivered-state protections.</text>
</svg>
