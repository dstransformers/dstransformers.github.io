  <text x="330" y="697" class="tiny muted">Quick actions: Edit in/out times · mark / remove employee leave · mark / unmark shared holiday for all</text><text x="330" y="716" class="tiny muted">Attendance status, hours and overtime remain available for export.</text>
  <rect x="986" y="459" width="386" height="275" rx="16" fill="#f8f6f1" stroke="#e7e4dc"/><text x="1008" y="489" font-size="15" class="bold ink">Monthly salary</text><text x="1008" y="509" class="tiny muted">Generated from attendance, holidays and overtime.</text>
  <text x="1008" y="542" class="tiny bold muted">PAY RULES</text><text x="1008" y="563" class="tiny ink">• Holidays and up to 2 absences are paid.</text><text x="1008" y="582" class="tiny ink">• Extra absences deduct at the daily rate.</text><text x="1008" y="601" class="tiny ink">• Overtime is paid at the hourly rate.</text>
