<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS employees attendance and salary UI mockup</title>
  <desc id="desc">Employee roster and payroll dashboard with photo attendance clock-in and clock-out, employee profile documents, monthly calendar for times leave and holidays, monthly salary generation and receipt, and exports.</desc>
