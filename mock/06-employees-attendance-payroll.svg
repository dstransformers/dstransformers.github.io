  <rect x="308" y="178" width="1064" height="65" rx="13" fill="#f8f6f1"/><text x="330" y="203" class="tiny bold muted">THIS MONTH</text><text x="330" y="226" class="sm bold ink">October 2026</text><rect x="507" y="194" width="174" height="32" rx="9" fill="#fff"/><text x="594" y="215" text-anchor="middle" class="tiny bold" fill="#47785e">3 ACTIVE EMPLOYEES</text><rect x="697" y="194" width="191" height="32" rx="9" fill="#fff"/><text x="792" y="215" text-anchor="middle" class="tiny bold" fill="#31566e">2 CLOCKED IN TODAY</text><rect x="904" y="194" width="221" height="32" rx="9" fill="#fff"/><text x="1014" y="215" text-anchor="middle" class="tiny bold" fill="#805721">1 SALARY NOT GENERATED</text><text x="1348" y="215" text-anchor="end" class="tiny bold" fill="#a45e39">Export attendance · salary</text>
  <rect x="308" y="261" width="1064" height="181" rx="16" fill="#fff" stroke="#e4e9e5"/><text x="330" y="291" font-size="15" class="bold ink">Today · quick attendance</text><text x="330" y="311" class="tiny muted">Tap the employee photo to clock in or clock out. A date/time entry can also be edited.</text>
