    <rect x="20" y="242" width="256" height="72" rx="13" fill="#fff" stroke="#e3e8e3"/><text x="36" y="266" class="sm bold ink">TN-145 · Karimnagar</text><text x="36" y="285" class="tiny muted">Received 14 Oct · 1 waiting</text><text x="36" y="302" class="tiny bold" fill="#98631f">10 / 10 transformers</text>
    <rect x="20" y="322" width="256" height="72" rx="13" fill="#fff" stroke="#e3e8e3"/><text x="36" y="346" class="sm bold ink">TN-144 · Khammam</text><text x="36" y="365" class="tiny muted">Received 13 Oct · 0 waiting</text><text x="36" y="382" class="tiny bold" fill="#47785e">5 / 10 transformers</text>
    <rect x="20" y="402" width="256" height="72" rx="13" fill="#fff" stroke="#e3e8e3"/><text x="36" y="426" class="sm bold ink">TN-143 · Nalgonda</text><text x="36" y="445" class="tiny muted">Received 12 Oct · 1 waiting</text><text x="36" y="462" class="tiny bold" fill="#98631f">7 / 10 transformers</text>
    <rect x="20" y="482" width="256" height="72" rx="13" fill="#fff" stroke="#e3e8e3"/><text x="36" y="506" class="sm bold ink">TN-142 · Mahabubnagar</text><text x="36" y="525" class="tiny muted">Received 10 Oct · 1 waiting</text><text x="36" y="542" class="tiny bold" fill="#98631f">7 / 10 transformers</text>
    <rect x="20" y="570" width="256" height="55" rx="12" fill="#eaf2ec"/><text x="36" y="592" class="tiny bold" fill="#47785e">ONE CENTER PER TNOTE · UP TO 10 UNITS</text><text x="36" y="610" class="tiny" fill="#587463">Assessment-ready units stay at the top.</text>
