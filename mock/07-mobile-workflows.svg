<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile workflow UI mockups</title>
  <desc id="desc">Four mobile-friendly screens for received TNote triage, transformer assessment, private quotation creation, and employee attendance, designed for comfortable one-handed workshop use.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f5f2"/><stop offset="1" stop-color="#e8eeeb"/></linearGradient>
    <linearGradient id="nav" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#132b3d" flood-opacity=".1"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:9px}.sm{font-size:11px}.label{font-size:9px;font-weight:700;letter-spacing:.7px}.bold{font-weight:700}.med{font-weight:600}</style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="48" y="58" font-size="25" class="bold ink">Made for the workshop floor</text>
  <text x="48" y="82" class="sm muted">Large tap targets, clear next steps, readable status colors and no blocking pop-ups.</text>
