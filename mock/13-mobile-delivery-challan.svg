<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile TGSPDCL delivery challan</title>
  <desc id="desc">Mobile DC flow with center and TNote selection, repaired transformer selection, TGSPDCL destination, GSTIN, date, empty drum return, PDF generation, and required signed proof before delivery.</desc>
  <defs><linearGradient id="top" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:9px}.sm{font-size:12px}.label{font-size:9px;font-weight:700;letter-spacing:.65px}.bold{font-weight:700}</style></defs>
  <rect width="430" height="932" fill="#f3f5f2"/><rect width="430" height="105" fill="url(#top)"/><text x="20" y="22" class="tiny bold white">9:41</text><text x="20" y="59" font-size="18" class="bold white">Create delivery challan</text><text x="20" y="80" class="tiny" fill="#ced9df">TGSPDCL · repaired units only</text>
  <rect x="18" y="117" width="394" height="48" rx="11" fill="#eaf2ec"/><text x="32" y="137" class="tiny bold" fill="#47785e">STEP 1 · CENTER &amp; SOURCE</text><text x="32" y="155" class="sm bold ink">Warangal · TN-146  ▾</text>
  <text x="20" y="190" class="sm bold ink">Select repaired transformers</text><text x="410" y="190" text-anchor="end" class="tiny bold" fill="#47785e">3 eligible at center</text>
  <rect x="18" y="203" width="394" height="72" rx="12" fill="#fff" stroke="#eadbce"/><rect x="31" y="220" width="20" height="20" rx="5" fill="#b8754f"/><path d="m35 229 4 4 8-9" fill="none" stroke="#fff" stroke-width="1.7"/><text x="64" y="227" class="sm bold ink">DTR-4088 · 500 kVA</text><text x="64" y="247" class="tiny muted">SN-88196 · TNote TN-146 · Warangal</text><rect x="64" y="253" width="67" height="16" rx="8" fill="#e7f1eb"/><text x="97" y="265" text-anchor="middle" font-size="8" font-weight="700" fill="#47785e">REPAIRED</text>
  <rect x="18" y="283" width="394" height="72" rx="12" fill="#fff" stroke="#e2e7e2"/><rect x="31" y="300" width="20" height="20" rx="5" fill="#b8754f"/><path d="m35 309 4 4 8-9" fill="none" stroke="#fff" stroke-width="1.7"/><text x="64" y="307" class="sm bold ink">DTR-4038 · 250 kVA</text><text x="64" y="327" class="tiny muted">SN-88081 · TNote TN-145 · Warangal</text><rect x="64" y="333" width="67" height="16" rx="8" fill="#e7f1eb"/><text x="97" y="345" text-anchor="middle" font-size="8" font-weight="700" fill="#47785e">REPAIRED</text>
  <text x="20" y="382" class="tiny muted">Only repaired units from the selected SPM Center can be added.</text>
  <rect x="18" y="397" width="394" height="190" rx="13" fill="#fff" stroke="#e2e7e2"/><text x="32" y="422" class="sm bold ink">Step 2 · Challan details</text>
  <text x="32" y="446" class="label muted">CUSTOMER</text><text x="32" y="466" class="sm bold ink">AE/SPM/Warangal/TGSPDCL</text>
  <text x="32" y="487" class="tiny muted">TGSPDCL address · GSTIN is filled from company defaults.</text>
  <rect x="32" y="500" width="178" height="42" rx="8" fill="#f7f8f5"/><text x="44" y="517" class="tiny bold muted">DC DATE</text><text x="44" y="535" class="sm ink">15 Oct 2026</text>
  <rect x="220" y="500" width="178" height="42" rx="8" fill="#f7f8f5"/><text x="232" y="517" class="tiny bold muted">EMPTY DRUMS?</text><text x="232" y="535" class="sm ink">Yes · 2  ▾</text>
  <rect x="18" y="600" width="394" height="69" rx="12" fill="#f8f6f1"/><text x="32" y="622" class="tiny bold ink">VALIDATION BEFORE SAVE</text><text x="32" y="641" class="tiny muted">Same SPM Center · unique repaired units · saved transformer</text><text x="32" y="657" class="tiny muted">details · TGSPDCL customer matches center</text>
  <rect x="18" y="681" width="394" height="50" rx="12" fill="#142b40"/><text x="215" y="703" text-anchor="middle" class="sm bold white">Create DC + generate PDF</text><text x="215" y="720" text-anchor="middle" class="tiny" fill="#ced9df">Open / regenerate PDF from the challan list</text>
  <rect x="18" y="745" width="394" height="86" rx="12" fill="#fff" stroke="#e2e7e2"/><text x="32" y="768" class="tiny bold" fill="#98631f">AFTER THE TRANSFORMERS RETURN</text><text x="32" y="789" class="sm bold ink">Upload signed challan to mark delivered</text><text x="32" y="808" class="tiny muted">Delivery proof is required; once delivered, DC cannot be edited or deleted.</text>
  <rect x="18" y="843" width="394" height="42" rx="10" fill="#eaf2ec"/><text x="215" y="869" text-anchor="middle" class="sm bold" fill="#47785e">Upload signed DC  ·  Mark delivered</text>
  <text x="20" y="913" class="tiny muted">Delivered units become eligible for government billing.</text>
</svg>
