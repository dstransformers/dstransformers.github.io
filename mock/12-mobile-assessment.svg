<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile transformer inspection and assessment</title>
  <desc id="desc">Mobile transformer assessment with the transformer list, status and assessment round, winding and inspection date, HV and LV coils and weights, bushings, rods, metal parts, breakers, oil, remarks, and repair-stage transitions.</desc>
  <defs><linearGradient id="top" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:9px}.sm{font-size:12px}.label{font-size:9px;font-weight:700;letter-spacing:.65px}.bold{font-weight:700}.med{font-weight:600}</style></defs>
  <rect width="430" height="932" fill="#f3f5f2"/><rect width="430" height="106" fill="url(#top)"/><text x="20" y="22" class="tiny bold white">9:41</text><text x="20" y="59" font-size="18" class="bold white">Transformer assessment</text><text x="20" y="80" class="tiny" fill="#ced9df">TN-146 · Warangal · TGSPDCL</text>
  <rect x="18" y="119" width="394" height="60" rx="12" fill="#fff" stroke="#e2e7e2"/><text x="32" y="140" class="tiny bold muted">SELECT TRANSFORMER · 2 RECEIVED</text><text x="32" y="164" class="sm bold ink">DTR-4102 · SN-88214 · 250 kVA</text><text x="393" y="160" text-anchor="end" class="tiny bold" fill="#a45e39">1 / 8</text>
  <rect x="18" y="190" width="394" height="50" rx="11" fill="#fbf1df"/><text x="32" y="211" class="tiny bold" fill="#98631f">RECEIVED → ASSESSMENT · ROUND 1</text><text x="32" y="228" class="tiny muted">First inspection required · can progress to Repair In Progress</text>
  <text x="20" y="265" class="sm bold ink">Inspection details</text><text x="410" y="265" text-anchor="end" class="tiny bold" fill="#a45e39">View prior round</text>
  <rect x="18" y="278" width="191" height="53" rx="10" fill="#fff" stroke="#e2e7e2"/><text x="31" y="298" class="tiny bold muted">WINDING MATERIAL</text><text x="31" y="319" class="sm ink">Copper (CU)  ▾</text>
  <rect x="217" y="278" width="195" height="53" rx="10" fill="#fff" stroke="#e2e7e2"/><text x="230" y="298" class="tiny bold muted">FIRST INSPECTION DATE</text><text x="230" y="319" class="sm ink">15 Oct 2026</text>
  <rect x="18" y="341" width="394" height="112" rx="11" fill="#fff" stroke="#e2e7e2"/>
  <text x="32" y="362" class="label" fill="#31566e">HV WINDING</text><text x="32" y="382" class="tiny muted">Damaged coils</text><rect x="32" y="390" width="90" height="32" rx="8" fill="#f7f8f5"/><text x="47" y="411" class="sm ink">2</text><text x="136" y="382" class="tiny muted">Old / new weight (kg)</text><rect x="136" y="390" width="260" height="32" rx="8" fill="#f7f8f5"/><text x="151" y="411" class="sm ink">18.4  /  19.2</text>
  <text x="32" y="442" class="tiny muted">Use numbers for counts and weights; zero is valid when inspected.</text>
  <rect x="18" y="463" width="394" height="112" rx="11" fill="#fff" stroke="#e2e7e2"/>
  <text x="32" y="484" class="label" fill="#31566e">LV WINDING</text><text x="32" y="504" class="tiny muted">Reinsulated coils</text><rect x="32" y="512" width="90" height="32" rx="8" fill="#f7f8f5"/><text x="47" y="533" class="sm ink">3</text><text x="136" y="504" class="tiny muted">Old / new weight (kg)</text><rect x="136" y="512" width="260" height="32" rx="8" fill="#f7f8f5"/><text x="151" y="533" class="sm ink">12.1  /  12.8</text><text x="32" y="563" class="tiny muted">Capture reinsulated coil count and corresponding weights.</text>
  <rect x="18" y="585" width="394" height="145" rx="11" fill="#fff" stroke="#e2e7e2"/>
  <text x="32" y="606" class="label" fill="#31566e">PARTS · OIL · REMARKS</text>
  <text x="32" y="628" class="tiny muted">Bushings LV / HV</text><text x="157" y="628" class="tiny bold ink">2 / 3</text><text x="229" y="628" class="tiny muted">Bush rods LV / HV</text><text x="370" y="628" class="tiny bold ink">1 / 2</text>
  <text x="32" y="650" class="tiny muted">Metal parts HV / LV</text><text x="157" y="650" class="tiny bold ink">1 / 2</text><text x="229" y="650" class="tiny muted">Breakers</text><text x="370" y="650" class="tiny bold ink">0</text>
  <text x="32" y="672" class="tiny muted">Oil capacity / less (L)</text><text x="157" y="672" class="tiny bold ink">320 / 12</text><text x="229" y="672" class="tiny muted">Remarks</text><text x="370" y="672" class="tiny bold ink">Edit ↓</text>
  <rect x="32" y="684" width="364" height="32" rx="8" fill="#f7f8f5"/><text x="45" y="705" class="tiny ink">Replace HV coils and inspect bushing…</text>
  <rect x="18" y="742" width="394" height="71" rx="12" fill="#eaf2ec"/><text x="32" y="765" class="tiny bold" fill="#47785e">SAVED ASSESSMENT → REPAIR IN PROGRESS</text><text x="32" y="784" class="tiny" fill="#587463">Repair may return to Assessment for round 2, then Repaired.</text><text x="32" y="802" class="tiny" fill="#587463">Repaired units become DC eligible; delivered units become billable.</text>
  <rect x="18" y="825" width="394" height="43" rx="11" fill="#142b40"/><text x="215" y="852" text-anchor="middle" class="sm bold white">Save assessment &amp; continue to repair</text>
  <text x="20" y="894" class="tiny muted">You can review / edit assessment details until billing; delivery locks destructive changes.</text>
</svg>
