<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS TGSPDCL TNote intake UI mockup</title>
  <desc id="desc">TNote queue and intake form with one SPM Center per TNote, up to ten transformer records, attachments, links, assessment export, and expandable transformer status counts.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f3f5f2"/><stop offset="1" stop-color="#e8eeeb"/></linearGradient>
    <linearGradient id="nav" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#132b3d" flood-opacity=".1"/></filter>
    <style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:10px}.sm{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:1px}.bold{font-weight:700}.med{font-weight:600}</style>
  </defs>
  <rect width="1440" height="1000" fill="url(#bg)"/><rect x="40" y="38" width="1360" height="924" rx="24" fill="#fff" filter="url(#sh)"/>
  <path d="M64 38h218v924H64q-24 0-24-24V62q0-24 24-24" fill="url(#nav)"/><rect x="258" y="38" width="24" height="924" fill="url(#nav)"/>
  <rect x="68" y="66" width="42" height="42" rx="13" fill="#fff" opacity=".12"/><path d="M79 94V80h4l5 7 5-7h4v14h-4v-8l-5 6-5-6v8z" fill="#fff"/><circle cx="101" cy="76" r="4" fill="#cb8054"/>
  <text x="120" y="83" class="sm bold white">D.S. TRANSFORMERS</text><text x="120" y="100" class="tiny" fill="#adbdc7">WORKSHOP OPERATIONS</text>
  <text x="72" y="145" class="label" fill="#9fb0bc">WORKSPACE</text><text x="86" y="184" class="sm" fill="#d6e0e5">Overview</text><text x="86" y="218" class="sm" fill="#d6e0e5">Private orders</text>
  <text x="72" y="270" class="label" fill="#9fb0bc">TGSPDCL ORDERS</text><rect x="67" y="284" width="192" height="39" rx="10" fill="#fff" opacity=".12"/><circle cx="84" cy="303" r="4" fill="#cb8054"/><text x="99" y="307" class="sm bold white">TNotes &amp; assessment</text><text x="99" y="340" class="sm" fill="#d6e0e5">Transformers</text><text x="99" y="371" class="sm" fill="#d6e0e5">Delivery challans</text><text x="99" y="402" class="sm" fill="#d6e0e5">Government bills</text>
  <text x="72" y="457" class="label" fill="#9fb0bc">PEOPLE</text><text x="99" y="490" class="sm" fill="#d6e0e5">Employees &amp; salary</text>
  <circle cx="91" cy="922" r="14" fill="#bf764b"/><text x="91" y="926" text-anchor="middle" class="tiny bold white">DS</text><text x="113" y="919" class="tiny bold white">Workshop admin</text><text x="113" y="934" class="tiny" fill="#adbdc7">Secure workspace</text>

  <rect x="282" y="38" width="1118" height="58" fill="#fff"/><line x1="282" y1="96" x2="1400" y2="96" stroke="#e9edea"/>
  <rect x="308" y="52" width="300" height="31" rx="9" fill="#f5f7f5"/><circle cx="325" cy="67" r="5" fill="none" stroke="#81909a" stroke-width="1.4"/><path d="m329 71 5 5" stroke="#81909a" stroke-width="1.4"/><text x="343" y="71" class="tiny muted">Search TNote, DTR, serial no…</text>
  <text x="308" y="137" font-size="24" class="bold ink">TGSPDCL · TNotes</text><text x="308" y="158" class="sm muted">Every TNote belongs to one SPM Center and can contain up to 10 transformers.</text>
  <rect x="1167" y="117" width="205" height="38" rx="11" fill="#142b40"/><text x="1269" y="141" text-anchor="middle" class="sm bold white">+ Create TNote</text>
  <rect x="308" y="178" width="1064" height="66" rx="13" fill="#f8f6f1"/>
  <text x="330" y="204" class="tiny bold muted">RECEIVED TNOTES TO ASSESS</text><text x="330" y="230" font-size="23" class="bold ink">5 <tspan font-size="12" class="muted">of up to 5 currently open</tspan></text>
  <rect x="556" y="194" width="150" height="34" rx="9" fill="#fff"/><text x="631" y="216" text-anchor="middle" class="tiny bold" fill="#805721">6 TRANSFORMERS RECEIVED</text>
  <text x="729" y="215" class="tiny muted">Tap a TNote to assess received transformers individually.</text>
  <rect x="308" y="261" width="1064" height="340" rx="16" fill="#fff" stroke="#e4e9e5"/>
  <text x="330" y="291" font-size="15" class="bold ink">Active TNotes</text><text x="330" y="311" class="tiny muted">One row per SPM Center; statuses are counted per transformer, not per TNote.</text>
  <rect x="330" y="328" width="1020" height="34" rx="8" fill="#f4f6f3"/>
  <text x="346" y="350" class="tiny bold muted">TNOTE / DATE</text><text x="538" y="350" class="tiny bold muted">SPM CENTER</text><text x="697" y="350" class="tiny bold muted">UNITS</text><text x="803" y="350" class="tiny bold muted">TRANSFORMER STATUS COUNTS</text><text x="1327" y="350" text-anchor="end" class="tiny bold muted">ACTIONS</text>
  <rect x="330" y="369" width="1020" height="43" rx="8" fill="#fcf7f2"/>
  <text x="346" y="388" class="sm bold ink">TN-146</text><text x="346" y="403" class="tiny muted">15 Oct 2026</text><text x="538" y="395" class="sm med ink">Warangal</text><text x="697" y="395" class="sm bold ink">8 / 10</text>
  <rect x="803" y="381" width="92" height="21" rx="10" fill="#fbefdc"/><text x="849" y="396" text-anchor="middle" class="tiny bold" fill="#98631f">2 RECEIVED</text><rect x="901" y="381" width="103" height="21" rx="10" fill="#e9eff2"/><text x="952" y="396" text-anchor="middle" class="tiny bold" fill="#31566e">2 ASSESSING</text><rect x="1010" y="381" width="74" height="21" rx="10" fill="#f1eee4"/><text x="1047" y="396" text-anchor="middle" class="tiny bold" fill="#786a45">3 REPAIR</text><rect x="1090" y="381" width="86" height="21" rx="10" fill="#e7f1eb"/><text x="1133" y="396" text-anchor="middle" class="tiny bold" fill="#47785e">1 REPAIRED</text><text x="1327" y="395" text-anchor="end" class="tiny bold" fill="#a45e39">Assess 2  ·  Details</text>
  <rect x="330" y="417" width="1020" height="43" rx="8" fill="#fff"/>
  <text x="346" y="436" class="sm bold ink">TN-145</text><text x="346" y="451" class="tiny muted">14 Oct 2026</text><text x="538" y="443" class="sm med ink">Karimnagar</text><text x="697" y="443" class="sm bold ink">10 / 10</text>
  <rect x="803" y="429" width="92" height="21" rx="10" fill="#fbefdc"/><text x="849" y="444" text-anchor="middle" class="tiny bold" fill="#98631f">1 RECEIVED</text><rect x="901" y="429" width="103" height="21" rx="10" fill="#e9eff2"/><text x="952" y="444" text-anchor="middle" class="tiny bold" fill="#31566e">3 ASSESSING</text><rect x="1010" y="429" width="74" height="21" rx="10" fill="#f1eee4"/><text x="1047" y="444" text-anchor="middle" class="tiny bold" fill="#786a45">4 REPAIR</text><rect x="1090" y="429" width="86" height="21" rx="10" fill="#e7f1eb"/><text x="1133" y="444" text-anchor="middle" class="tiny bold" fill="#47785e">2 REPAIRED</text><text x="1327" y="443" text-anchor="end" class="tiny bold" fill="#a45e39">Assess 1  ·  Details</text>
  <rect x="330" y="465" width="1020" height="43" rx="8" fill="#fcf7f2"/>
  <text x="346" y="484" class="sm bold ink">TN-144</text><text x="346" y="499" class="tiny muted">13 Oct 2026</text><text x="538" y="491" class="sm med ink">Khammam</text><text x="697" y="491" class="sm bold ink">6 / 10</text>
  <rect x="803" y="477" width="92" height="21" rx="10" fill="#fbefdc"/><text x="849" y="492" text-anchor="middle" class="tiny bold" fill="#98631f">1 RECEIVED</text><rect x="901" y="477" width="103" height="21" rx="10" fill="#e9eff2"/><text x="952" y="492" text-anchor="middle" class="tiny bold" fill="#31566e">0 ASSESSING</text><rect x="1010" y="477" width="74" height="21" rx="10" fill="#f1eee4"/><text x="1047" y="492" text-anchor="middle" class="tiny bold" fill="#786a45">2 REPAIR</text><rect x="1090" y="477" width="86" height="21" rx="10" fill="#e7f1eb"/><text x="1133" y="492" text-anchor="middle" class="tiny bold" fill="#47785e">2 REPAIRED</text><text x="1327" y="491" text-anchor="end" class="tiny bold" fill="#a45e39">Assess 1  ·  Details</text>
  <rect x="330" y="513" width="1020" height="43" rx="8" fill="#fff"/>
  <text x="346" y="532" class="sm bold ink">TN-143</text><text x="346" y="547" class="tiny muted">12 Oct 2026</text><text x="538" y="539" class="sm med ink">Nalgonda</text><text x="697" y="539" class="sm bold ink">9 / 10</text><rect x="803" y="525" width="92" height="21" rx="10" fill="#fbefdc"/><text x="849" y="540" text-anchor="middle" class="tiny bold" fill="#98631f">1 RECEIVED</text><rect x="901" y="525" width="103" height="21" rx="10" fill="#e9eff2"/><text x="952" y="540" text-anchor="middle" class="tiny bold" fill="#31566e">0 ASSESSING</text><rect x="1010" y="525" width="74" height="21" rx="10" fill="#f1eee4"/><text x="1047" y="540" text-anchor="middle" class="tiny bold" fill="#786a45">2 REPAIR</text><rect x="1090" y="525" width="86" height="21" rx="10" fill="#e7f1eb"/><text x="1133" y="540" text-anchor="middle" class="tiny bold" fill="#47785e">4 REPAIRED</text><text x="1327" y="539" text-anchor="end" class="tiny bold" fill="#a45e39">Assess 1  ·  Details</text>
  <rect x="330" y="561" width="1020" height="27" rx="7" fill="#fcf7f2"/><text x="346" y="579" class="tiny bold ink">TN-142 · Mahabubnagar</text><text x="538" y="579" class="tiny med ink">7 / 10 transformers</text><text x="697" y="579" class="tiny muted">1 Received · 2 Assessment · 2 Repair · 2 Repaired</text><text x="1327" y="579" text-anchor="end" class="tiny bold" fill="#a45e39">Assess 1  ·  Details</text>
  <text x="330" y="620" class="tiny muted">Filters: TNote no. · date · SPM Center · transformer count  |  Attachments · Joint Inspection Excel export · DC shortcut when repaired units exist</text>

  <rect x="308" y="648" width="1064" height="276" rx="16" fill="#f8f6f1" stroke="#e7e4dc"/>
  <text x="330" y="678" font-size="15" class="bold ink">Create TNote + register transformers</text><text x="330" y="697" class="tiny muted">Keep the center at TNote level so all units belong to exactly one SPM Center.</text>
  <rect x="330" y="714" width="240" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="345" y="731" class="tiny bold muted">TNOTE NUMBER</text><text x="345" y="746" class="tiny ink">Enter TGSPDCL TNote no.</text>
  <rect x="580" y="714" width="190" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="595" y="731" class="tiny bold muted">TNOTE DATE</text><text x="595" y="746" class="tiny ink">15 Oct 2026</text>
  <rect x="780" y="714" width="245" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="795" y="731" class="tiny bold muted">SPM CENTER · SINGLE CENTER</text><text x="795" y="746" class="tiny ink">Select once · applied to every unit</text>
  <rect x="1035" y="714" width="315" height="40" rx="8" fill="#fff" stroke="#e0e5df"/><text x="1050" y="731" class="tiny bold muted">DOCUMENTS</text><text x="1050" y="746" class="tiny ink">Add up to 5 photos / PDFs · 2 MB each</text>
  <text x="330" y="779" class="tiny bold muted">TRANSFORMER ENTRY · REQUIRED FOR EACH UNIT</text><text x="1328" y="779" text-anchor="end" class="tiny bold" fill="#a45e39">1 OF 10 ADDED</text>
  <rect x="330" y="789" width="1020" height="35" rx="8" fill="#fff" stroke="#e0e5df"/>
  <text x="344" y="812" class="tiny bold muted">DTR NO.</text><text x="503" y="812" class="tiny bold muted">SERIAL NO.</text><text x="652" y="812" class="tiny bold muted">CAPACITY</text><text x="803" y="812" class="tiny bold muted">TYPE</text><text x="988" y="812" class="tiny bold muted">OIL CAPACITY</text><text x="1195" y="812" class="tiny bold muted">CENTER</text>
  <rect x="330" y="830" width="1020" height="38" rx="8" fill="#fff" stroke="#e0e5df"/>
  <text x="344" y="854" class="tiny ink">DTR-4102</text><text x="503" y="854" class="tiny ink">SN-88214</text><text x="652" y="854" class="tiny ink">250 kVA</text><text x="803" y="854" class="tiny ink">Distribution</text><text x="988" y="854" class="tiny ink">— L</text><text x="1195" y="854" class="tiny ink">Warangal · inherited</text><text x="1328" y="854" text-anchor="end" class="tiny bold" fill="#a45e39">Remove</text>
  <text x="330" y="894" class="tiny bold" fill="#a45e39">+ ADD ANOTHER TRANSFORMER</text><text x="620" y="894" class="tiny muted">Each row requires DTR no., serial no., capacity, type and oil capacity.</text>
  <rect x="1123" y="875" width="227" height="36" rx="9" fill="#142b40"/><text x="1236" y="898" text-anchor="middle" class="tiny bold white">Create TNote &amp; transformers</text>
  <text x="308" y="947" class="tiny muted">Individual unit states stay independent inside the TNote. Only Received units appear in the assessment queue; repaired units can start a DC workflow.</text>
</svg>
