<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">VSTMS mobile TGSPDCL TNote management</title>
  <desc id="desc">Mobile TNote list and intake process with a single SPM Center per TNote, capacity for ten transformer records, photo or PDF attachments, inspection export, status overview, RGP visit lookup, and delivery-challan shortcut.</desc>
  <defs><linearGradient id="top" x2="1" y2="1"><stop stop-color="#172f44"/><stop offset="1" stop-color="#102338"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#132b3d" flood-opacity=".08"/></filter><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.ink{fill:#172e40}.muted{fill:#71808b}.white{fill:#fff}.tiny{font-size:10px}.sm{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:.7px}.bold{font-weight:700}.med{font-weight:600}</style></defs>
  <rect width="430" height="932" fill="#f3f5f2"/><rect width="430" height="110" fill="url(#top)"/><text x="20" y="23" class="tiny bold white">9:41</text><text x="20" y="62" font-size="19" class="bold white">TGSPDCL · TNotes</text><text x="20" y="83" class="tiny" fill="#ced9df">One SPM Center per note · up to 10 units</text>
  <rect x="20" y="125" width="390" height="55" rx="12" fill="#f8f6f1"/><text x="36" y="148" class="tiny bold muted">RECEIVED TNOTES TO ASSESS</text><text x="36" y="168" class="sm bold ink">5 open · 6 transformers received</text><rect x="308" y="136" width="86" height="32" rx="9" fill="#142b40"/><text x="351" y="156" text-anchor="middle" class="tiny bold white">+ Create</text>
